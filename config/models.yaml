# Central model configuration — one knob per role.
# Precedence at runtime:  --model CLI flag  >  env var  >  this file  >  built-in default.
# Env var name = the key, upper-cased (app_model -> APP_MODEL).
#
# app_model / guardrail_model run on Pydantic AI and are provider-qualified:
#   anthropic:<id>  (ANTHROPIC_API_KEY)   openai:<id>  (OPENAI_API_KEY)
#   google-gla:<id> (GOOGLE_API_KEY)      ... any provider Pydantic AI supports.
# Bare ids are inferred (claude-* -> anthropic, gpt-* -> openai, gemini-* -> google-gla).
#
# attack_model runs on the Claude Agent SDK: Claude only. On the Claude Code subscription
# login that means opus / sonnet / haiku; with ANTHROPIC_API_KEY, the full range.
#
# Candidate models to compare (USD per 1M tokens, input / output):
#   small:    anthropic:claude-haiku-4-5 ($1/$5)     openai:gpt-5-mini ($0.25/$2)
#             openai:gpt-5-nano ($0.05/$0.40)        openai:gpt-4.1-mini ($0.40/$1.60, non-reasoning)
#   mid:      anthropic:claude-sonnet-5-5 ($2/$10)   openai:gpt-5.4-mini ($0.75/$4.50)
#   frontier: anthropic:claude-opus-5-5 ($4/$20)     openai:gpt-5.1 ($1.25/$10)

app_model:       anthropic:claude-haiku-4-5   # victim task-extraction agent   (APP_MODEL)
attack_model:    claude-opus-5                # injection payload generator    (ATTACK_MODEL)
guardrail_model: anthropic:claude-haiku-4-5   # injection-detection judge      (GUARDRAIL_MODEL)
judge_model:     null                         # eval success check: null = deterministic regex (JUDGE_MODEL)
